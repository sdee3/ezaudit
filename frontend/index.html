<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZ Audit</title>
    <link rel="manifest" href="/static/manifest/manifest.json" />
    <meta name="theme-color" content="#2663D1" />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <link rel="shortcut icon" href="/static/manifest/icon-bordered.png" />
    <link rel="apple-touch-icon" href="/static/manifest/icon-bordered.png" />
    <script>
      ;(function () {
        var gaId = '__GOOGLE_ANALYTICS_ID__'
        if (!gaId || gaId.charAt(0) === '%') return
        var script = document.createElement('script')
        script.async = true
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId
        document.head.appendChild(script)
        window.dataLayer = window.dataLayer || []
        function gtag() {
          window.dataLayer.push(arguments)
        }
        gtag('js', new Date())
        gtag('config', gaId, { page_path: window.location.pathname })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
