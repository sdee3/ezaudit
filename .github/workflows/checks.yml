name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Worker checks
        run: |
          npm ci --prefix workers/lighthouse-worker
          node --check workers/lighthouse-worker/index.mjs
          node --check workers/lighthouse-worker/egress-proxy.mjs
          node --check workers/lighthouse-worker/proof.mjs
          node --check workers/lighthouse-worker/address-filter.test.mjs
          npm test --prefix workers/lighthouse-worker
